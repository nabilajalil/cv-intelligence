
[project]
name = "cv-intelligence"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.70,<4",
    "chromadb>=1.0,<2",
    "pymupdf>=1.25,<3",
    "python-docx>=1.1,<2",
    "rank-bm25>=0.2,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
agent = [
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-ollama>=1.2,<2",
    "langsmith>=0.15,<1",
]
ui = [
    "streamlit>=1.40,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cv_intelligence*"]

[tool.pytest.ini_options]
pythonpath = ["."]
